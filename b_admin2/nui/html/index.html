<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_Admin2</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="app" class="hidden">
        <!-- Menu Latéral Gauche -->
        <div class="sidebar-left">
            <!-- Header -->
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">A</div>
                    <div class="brand-text">
                        <h1>Admin Panel</h1>
                        <span id="server-name">REVIVE RP</span>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" id="player-search" placeholder="Rechercher un joueur...">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </div>

            <!-- Stats Quick -->
            <div class="stats-quick">
                <div class="stat-item">
                    <span class="stat-label">Joueurs</span>
                    <span class="stat-value" id="stat-players">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Staff</span>
                    <span class="stat-value" id="stat-staff">0</span>
                </div>
            </div>

            <!-- Players List -->
            <div class="players-section">
                <div class="section-header">
                    <span>Joueurs en ligne</span>
                    <button id="refresh-players" class="icon-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                        </svg>
                    </button>
                </div>
                <div id="players-list" class="players-list"></div>
            </div>

            <!-- Quick Actions Bottom -->
            <div class="quick-actions">
                <button id="btn-staffmode" class="action-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Staff Mode</span>
                </button>
                <button id="close-btn" class="action-btn danger">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    <span>Fermer</span>
                </button>
            </div>
        </div>

        <!-- Player Detail Panel (slide from right) -->
        <div id="player-panel" class="player-panel hidden">
            <div class="panel-header">
                <h2 id="panel-player-name">Joueur</h2>
                <button id="close-panel" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="panel-content" id="panel-content">
                <!-- Dynamically loaded player info -->
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
